services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      TERRAPOINT_API_URL: ${TERRAPOINT_API_URL:-https://terrapoint.ee}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://praktika.arleserver.cfd}
      DATABASE_URL: postgresql://practice_user:${POSTGRES_PASSWORD}@postgres:5432/keskkonnaportaal_practice
      DATABASE_SSL: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: keskkonnaportaali_praktika_sources
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash-free}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keskkonnaportaal_practice
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - practice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d keskkonnaportaal_practice"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - practice-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  practice-postgres:
  practice-qdrant:
