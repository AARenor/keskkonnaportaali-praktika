services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      TERRAPOINT_API_URL: ${TERRAPOINT_API_URL:-https://terrapoint.ee}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://praktika.arleserver.cfd}
      DATABASE_URL: postgresql://practice_user:${POSTGRES_PASSWORD}@postgres:5432/keskkonnaportaal_practice
      DATABASE_SSL: "false"
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-14500}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1600}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_API_STYLE: ${LLM_API_STYLE:-responses}
      LLM_CIRCUIT_BREAK_MS: ${LLM_CIRCUIT_BREAK_MS:-900000}
      SEARCH_CACHE_ENABLED: ${SEARCH_CACHE_ENABLED:-true}
      SEARCH_DEADLINE_MS: ${SEARCH_DEADLINE_MS:-15000}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      CORPUS_SYNC_ON_START: ${CORPUS_SYNC_ON_START:-true}
      CORPUS_SYNC_INTERVAL_HOURS: ${CORPUS_SYNC_INTERVAL_HOURS:-24}
      CORPUS_SEED_QUERIES: ${CORPUS_SEED_QUERIES:-mets}
      CORPUS_STARTUP_HYDRATE_LIMIT: ${CORPUS_STARTUP_HYDRATE_LIMIT:-200}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keskkonnaportaal_practice
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - practice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d keskkonnaportaal_practice"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: ["experimental-vector"]
    volumes:
      - practice-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  practice-postgres:
  practice-qdrant:
