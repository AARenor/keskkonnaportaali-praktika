services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      TERRAPOINT_API_URL: ${TERRAPOINT_API_URL:-https://terrapoint.ee}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the exact browser-visible origin in .env}
      PROXY_MODE: ${PROXY_MODE:?Set PROXY_MODE to direct or trusted in .env}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS-}
      IPV6_CLIENT_PREFIX_BITS: ${IPV6_CLIENT_PREFIX_BITS:-64}
      MAX_HTTP_CONNECTIONS: ${MAX_HTTP_CONNECTIONS:-256}
      MAX_ACTIVE_PUBLIC_RESPONSES: ${MAX_ACTIVE_PUBLIC_RESPONSES:-224}
      MAX_ACTIVE_GENERAL_RESPONSES: ${MAX_ACTIVE_GENERAL_RESPONSES:-192}
      MAX_ACTIVE_PUBLIC_RESPONSES_PER_CLIENT: ${MAX_ACTIVE_PUBLIC_RESPONSES_PER_CLIENT:-16}
      MAX_ACTIVE_GENERAL_RESPONSES_PER_CLIENT: ${MAX_ACTIVE_GENERAL_RESPONSES_PER_CLIENT:-12}
      PUBLIC_RESPONSE_IDLE_TIMEOUT_MS: ${PUBLIC_RESPONSE_IDLE_TIMEOUT_MS:-20000}
      PUBLIC_RESPONSE_ABSOLUTE_TIMEOUT_MS: ${PUBLIC_RESPONSE_ABSOLUTE_TIMEOUT_MS:-60000}
      DATABASE_URL: postgresql://practice_user:${POSTGRES_PASSWORD}@postgres:5432/keskkonnaportaal_practice
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-12}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-4000}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-14500}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-3200}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_API_STYLE: ${LLM_API_STYLE:-responses}
      LLM_CIRCUIT_BREAK_MS: ${LLM_CIRCUIT_BREAK_MS:-900000}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_BUDGET_WINDOW_MS: ${LLM_BUDGET_WINDOW_MS:-3600000}
      LLM_ROLLING_REQUEST_BUDGET: ${LLM_ROLLING_REQUEST_BUDGET:-60}
      LLM_ROLLING_TOKEN_BUDGET: ${LLM_ROLLING_TOKEN_BUDGET:-240000}
      LLM_CLIENT_REQUEST_BUDGET: ${LLM_CLIENT_REQUEST_BUDGET:-15}
      LLM_CLIENT_TOKEN_BUDGET: ${LLM_CLIENT_TOKEN_BUDGET:-120000}
      LLM_CLIENT_BUDGET_KEYS: ${LLM_CLIENT_BUDGET_KEYS:-2000}
      SEARCH_CACHE_ENABLED: ${SEARCH_CACHE_ENABLED:-true}
      SEARCH_HASH_SECRET: ${SEARCH_HASH_SECRET:?Set an independent Base64 random SEARCH_HASH_SECRET of at least 32 bytes in .env}
      SEARCH_DEADLINE_MS: ${SEARCH_DEADLINE_MS:-15000}
      SEARCH_MAX_CONCURRENCY: ${SEARCH_MAX_CONCURRENCY:-8}
      SEARCH_MAX_CONCURRENCY_PER_CLIENT: ${SEARCH_MAX_CONCURRENCY_PER_CLIENT:-2}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      CORPUS_SYNC_ON_START: ${CORPUS_SYNC_ON_START:-true}
      CORPUS_SYNC_INTERVAL_HOURS: ${CORPUS_SYNC_INTERVAL_HOURS:-24}
      CORPUS_SEED_QUERIES: ${CORPUS_SEED_QUERIES:-mets}
      CORPUS_STARTUP_HYDRATE_LIMIT: ${CORPUS_STARTUP_HYDRATE_LIMIT:-200}
      PORTAL_UNAVAILABLE_RETENTION_HOURS: ${PORTAL_UNAVAILABLE_RETENTION_HOURS:-720}
      CORPUS_MAX_ROWS: ${CORPUS_MAX_ROWS:-150000}
      CORPUS_MAX_BYTES: ${CORPUS_MAX_BYTES:-2000000000}
      OFFICIAL_DISCOVERY_RETENTION_HOURS: ${OFFICIAL_DISCOVERY_RETENTION_HOURS:-168}
      OFFICIAL_DISCOVERY_MAX_ROWS: ${OFFICIAL_DISCOVERY_MAX_ROWS:-20000}
      OFFICIAL_DISCOVERY_PROCESS_URL_BUDGET: ${OFFICIAL_DISCOVERY_PROCESS_URL_BUDGET:-10000}
      OFFICIAL_DISCOVERY_CLIENT_URL_BUDGET: ${OFFICIAL_DISCOVERY_CLIENT_URL_BUDGET:-500}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/container-readiness"]
      interval: 1s
      timeout: 2s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: keskkonnaportaal_practice
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - practice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d keskkonnaportaal_practice"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    profiles: ["experimental-vector"]
    volumes:
      - practice-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  practice-postgres:
  practice-qdrant:
